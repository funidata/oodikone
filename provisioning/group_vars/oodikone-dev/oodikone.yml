oodikone_site: oodikone-dev
oodikone_server_name: oodikone-dev.funidata.fi

oodikone_sis_application_account: oodik-dev-01
oodikone_sis_host: https://sis-demo.funidata.fi

oodikone_version: production

# manually built images
oodikone_infra_version: fd-infra-20240712-04
#oodikone_backend_docker_image: "quay.io/toska/oodikone-backend:{{ oodikone_version }}"
oodikone_backend_docker_image: "637423527834.dkr.ecr.eu-north-1.amazonaws.com/oodikone/oodikone-backend:{{ oodikone_infra_version }}"
#oodikone_frontend_docker_image: "quay.io/toska/oodikone-frontend:{{ oodikone_version }}"
oodikone_frontend_docker_image: "637423527834.dkr.ecr.eu-north-1.amazonaws.com/oodikone/oodikone-frontend:{{ oodikone_infra_version }}"

oodikone_sis_updater_nats_docker_image: "nats-streaming:0.25.6"

# oodikone_sis_updater_scheduler_docker_image: "quay.io/toska/updater-scheduler:{{ oodikone_version }}"
# oodikone_sis_updater_worker_docker_image: "quay.io/toska/updater-worker:{{ oodikone_version }}"
oodikone_sis_updater_scheduler_docker_image: "637423527834.dkr.ecr.eu-north-1.amazonaws.com/oodikone/updater-scheduler:{{ oodikone_infra_version }}"
oodikone_sis_updater_worker_docker_image: "637423527834.dkr.ecr.eu-north-1.amazonaws.com/oodikone/updater-worker:{{ oodikone_infra_version }}"

oodikone_nats_uri: "{{ nats_cid }}://localhost:4222"
oodikone_valkey_uri: "//localhost:{{ valkey_port }}"

oodikone_sis_updater_scheduler_url: http://localhost:8082
oodikone_sis_importer_db_api_url: "http://{{ importer_db_api_host }}:3000"

# oodikone_postgres_database: oodikone

oodikone_nginx_identity_providers:
  - "{{ oodikone_nginx_env_configs_identityProvider_SIS }}"

oodikone_nginx_env_configs_identityProvider_SIS:
  name: SIS Login
  navigate: /Shibboleth.sso/SISLogin?target=

# DB needs to have user row ready in order for login to work
oodikone_app_users:
  - full_name: otm-test-50
    eppn: otm-test-50@sis-dev.funidata.fi
    language: fi
    sisu_person_id: fd-hlo-0000050
    roles:
      - admin
      - courseStatistics
      - studyGuidanceGroups
      - facultyStatistics
      - teachers
    programme_rights:
      - KH0_005
  - full_name: otm-test-51
    eppn: otm-test-51@sis-dev.funidata.fi
    language: fi
    sisu_person_id: fd-hlo-0000051
    roles:
      - basic
    programme_rights: []
