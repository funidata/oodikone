oodikone_site: oodikone-jyu-demo
oodikone_server_name: oodikone-jyu-demo.funidata.fi

oodikone_sis_application_account: jyu-oodikone-demo-01
oodikone_sis_host: https://sis-jyu-staging.funidata.fi
oodikone_root_org_id: jyu-university-root-id

oodikone_version: infra-dev-20240731-05
# containers have been built with staging = 'true', use staging configuration in oodikone_nginx
oodikone_staging: false
oodikone_node_env: production

oodikone_nginx_identity_providers:
  - "{{ oodikone_nginx_env_configs_identityProvider_SIS }}"

oodikone_nginx_env_configs_identityProvider_SIS:
  name: SIS Login
  navigate: /Shibboleth.sso/SISLogin?target=

