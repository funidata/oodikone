- name: Disable postgres database connections
  postgresql_query:
    login_host: "{{ postgres_admin_host }}"
    login_port: "{{ postgres_admin_port }}"
    login_user: "{{ postgres_admin_user }}"
    login_password: "{{ postgres_admin_password }}"

    db: "{{ postgres_admin_database }}"
    query: |-
      ALTER DATABASE "{{ postgres_database }}" WITH ALLOW_CONNECTIONS false;
  tags: disable_database_connections

- name: Kill postgres database sessions
  postgresql_query:
    login_host: "{{ postgres_admin_host }}"
    login_port: "{{ postgres_admin_port }}"
    login_user: "{{ postgres_admin_user }}"
    login_password: "{{ postgres_admin_password }}"

    db: "{{ postgres_admin_database }}"
    query: |-
      SELECT pid, pg_terminate_backend(pid)
        FROM pg_stat_activity
        WHERE datname = '{{ postgres_database }}' AND pid != pg_backend_pid()
  when: not ansible_check_mode # SELECT pg_terminate_backend(pid) will have an effect even in a --check mode transaction
  register: kill_database_sessions
  changed_when: kill_database_sessions.query_result | length > 0
  tags: kill_database_sessions

- name: Drop postgres database
  postgresql_db:
    login_host: "{{ postgres_admin_host }}"
    login_port: "{{ postgres_admin_port }}"
    login_user: "{{ postgres_admin_user }}"
    login_password: "{{ postgres_admin_password }}"

    name: "{{ postgres_database }}"
    state: absent
  tags: drop_database
