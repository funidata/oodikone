- hosts: aws_oodikone_app
  tasks:
    - import_tasks: tasks/postgres/drop_database.yml
      vars:
        postgres_admin_host: "{{ oodikone_postgres_admin_host }}"
        postgres_admin_port: "{{ oodikone_postgres_admin_port }}"
        postgres_admin_user: "{{ oodikone_postgres_admin_user }}"
        postgres_admin_password: "{{ oodikone_postgres_admin_password }}"
        postgres_admin_database: "{{ oodikone_postgres_admin_database }}"

        # db to be dropped
        postgres_database: "{{ oodikone_postgres_kone_db_database.name }}"
      tags: oodikone_postgres_drop_kone_db_database

    - import_tasks: tasks/postgres/drop_database.yml
      vars:
        postgres_admin_host: "{{ oodikone_postgres_admin_host }}"
        postgres_admin_port: "{{ oodikone_postgres_admin_port }}"
        postgres_admin_user: "{{ oodikone_postgres_admin_user }}"
        postgres_admin_password: "{{ oodikone_postgres_admin_password }}"
        postgres_admin_database: "{{ oodikone_postgres_admin_database }}"

        # db to be dropped
        postgres_database: "{{ oodikone_postgres_sis_db_database.name }}"
      tags: oodikone_postgres_drop_sis_db_database

    - import_tasks: tasks/postgres/drop_database.yml
      vars:
        postgres_admin_host: "{{ oodikone_postgres_admin_host }}"
        postgres_admin_port: "{{ oodikone_postgres_admin_port }}"
        postgres_admin_user: "{{ oodikone_postgres_admin_user }}"
        postgres_admin_password: "{{ oodikone_postgres_admin_password }}"
        postgres_admin_database: "{{ oodikone_postgres_admin_database }}"

        # db to be dropped
        postgres_database: "{{ oodikone_postgres_user_db_database.name }}"
      tags: oodikone_postgres_drop_user_db_database

    - name: Provision oodikone databases
      import_role:
        name: oodikone_postgres_database
      tags: oodikone_postgres_database

- hosts: aws_sis_importer_app
  tasks:
    - import_tasks: tasks/postgres/drop_database.yml
      vars:
        postgres_admin_host: "{{ oodikone_postgres_admin_host }}"
        postgres_admin_port: "{{ oodikone_postgres_admin_port }}"
        postgres_admin_user: "{{ oodikone_postgres_admin_user }}"
        postgres_admin_password: "{{ oodikone_postgres_admin_password }}"
        postgres_admin_database: "{{ oodikone_postgres_admin_database }}"

        # db to be dropped
        postgres_database: "{{ sis_importer_postgres_importer_db_database.name }}"
      tags: oodikone_postgres_drop_sis_importer_database

    - name: Provision sis-importer database
      import_role:
        name: sis_importer_postgres_database
      tags: sis_importer_postgres_database
